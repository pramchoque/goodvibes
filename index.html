<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Good Vibes Playlist</title>
<meta name="theme-color" content="#150E26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Good Vibes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#150E26;
    --surface:#221641;
    --surface-2:#2C1D52;
    --line:rgba(255,255,255,.09);
    --text:#F8F2FB;
    --muted:#A093C4;
    --sun:#F9B36A;
    --amber:#F9B36A;
    --peach:#FFD3A0;
    --magenta:#C95BA6;
    --pink:#E06FB0;
    --violet:#7C5BC9;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
    --nav-h:64px;
    --font:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:var(--font);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    -webkit-user-select:none;user-select:none;
  }
  input,textarea{-webkit-user-select:text;user-select:text;font-family:var(--font)}
  button{font-family:var(--font);touch-action:manipulation}

  /* cahaya di balik header */
  .bloom{position:fixed;left:0;right:0;top:0;height:46vh;z-index:0;pointer-events:none;overflow:hidden}
  .bloom i{position:absolute;border-radius:50%;filter:blur(60px)}
  .b1{width:70vw;height:44vw;left:-14vw;top:-16vw;background:var(--violet);opacity:.55}
  .b2{width:62vw;height:38vw;right:-10vw;top:-14vw;background:var(--sun);opacity:.4}
  .b3{width:52vw;height:32vw;left:24vw;top:-4vw;background:var(--magenta);opacity:.42}

  /* ---------- banner ---------- */
  .banner{
    position:relative;overflow:hidden;border-radius:24px;margin-top:20px;
    aspect-ratio:16/9;background:linear-gradient(120deg,var(--violet),var(--magenta) 55%,var(--sun));
    display:flex;align-items:flex-end;
  }
  .banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .banner .shade{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(21,14,38,0) 34%,rgba(21,14,38,.86) 100%)}
  .banner .btext{position:relative;padding:18px 20px 18px}
  .banner h2{font-size:clamp(19px,5.4vw,26px);font-weight:600;line-height:1.15;letter-spacing:-.02em;margin:6px 0 0}
  .banner .kick{color:var(--peach)}
  @media (min-width:720px){ .banner{aspect-ratio:21/9} }

  main{position:relative;z-index:1;padding:0 20px}
  .pad{height:calc(var(--nav-h) + var(--safe-b) + 40px)}
  .screen{display:none}
  .screen.on{display:block}

  /* ---------- header ---------- */
  .head{display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 16px) 0 0}
  .avatar{
    width:52px;height:52px;flex:none;border-radius:50%;cursor:pointer;border:0;
    display:grid;place-items:center;color:#1A1220;
    font-weight:700;font-size:20px;
    background:linear-gradient(140deg,var(--peach),var(--pink));
  }
  .head .sp{flex:1}
  .hbtn{
    width:44px;height:44px;flex:none;border-radius:50%;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);color:var(--text);
    display:grid;place-items:center;
  }
  .hbtn svg{width:19px;height:19px}
  .hbtn:active{transform:scale(.92)}
  .greet{font-size:clamp(28px,7.6vw,34px);font-weight:600;letter-spacing:-.02em;margin:20px 0 0}
  .greet b{font-weight:600;background:linear-gradient(96deg,var(--peach),var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:13.5px;margin:4px 0 0;overflow-wrap:anywhere}

  /* ---------- chips ---------- */
  .chiprow{
    display:flex;gap:10px;margin:18px -20px 0;padding:0 20px 4px;
    overflow-x:auto;scrollbar-width:none;
  }
  .chiprow::-webkit-scrollbar{display:none}
  .chip{
    flex:none;cursor:pointer;white-space:nowrap;
    background:var(--surface);border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:11px 20px;font-size:14px;font-weight:500;
  }
  .chip[aria-pressed="true"]{background:var(--amber);border-color:transparent;color:#1A1220;font-weight:600}

  /* ---------- judul bagian ---------- */
  .sechead{display:flex;align-items:baseline;gap:10px;margin:28px 0 14px}
  .sechead h2{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0;flex:1}
  .sechead button{background:none;border:0;color:var(--amber);font-size:13.5px;font-weight:500;cursor:pointer;padding:0}

  /* ---------- kartu sorotan ---------- */
  .feat{
    position:relative;overflow:hidden;border-radius:22px;padding:20px;
    min-height:180px;display:flex;flex-direction:column;justify-content:space-between;
    background:linear-gradient(115deg,var(--peach),#F5946B 62%,#E06FB0);color:#2A1230;
  }
  .feat .art{
    position:absolute;right:0;top:0;bottom:0;width:44%;
    background-size:cover;background-position:center;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 34%);
    mask-image:linear-gradient(90deg,transparent,#000 34%);
  }
  .feat .fx{position:relative;max-width:60%}
  .feat h3{font-size:21px;font-weight:600;line-height:1.2;letter-spacing:-.02em;margin:0}
  .feat p{font-size:13px;margin:7px 0 0;opacity:.78;line-height:1.45}
  .feat .acts{position:relative;display:flex;align-items:center;gap:14px;margin-top:20px}
  .fbtn{width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;
    background:#2A1230;color:#FFF;display:grid;place-items:center}
  .fbtn svg{width:14px;height:14px;margin-left:2px}
  .fico{background:none;border:0;cursor:pointer;color:#2A1230;padding:4px;display:grid;place-items:center}
  .fico svg{width:21px;height:21px}
  .fico.on svg{fill:currentColor}
  .fbtn:active,.fico:active{transform:scale(.9)}

  /* ---------- baris lagu ---------- */
  .rows{list-style:none;margin:0;padding:0}
  .row{display:flex;gap:14px;align-items:center;padding:9px 0;cursor:pointer}
  .row:active{opacity:.6}
  .thumb{width:58px;height:58px;flex:none;border-radius:15px;overflow:hidden;
    display:grid;place-items:center;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .ini{font-weight:700;font-size:21px;color:rgba(255,255,255,.92);mix-blend-mode:overlay}
  .rtx{flex:1;min-width:0}
  .rtx b{display:block;font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rtx span{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rbtn{width:38px;height:38px;flex:none;border-radius:50%;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);color:var(--text);
    display:grid;place-items:center}
  .rbtn svg{width:12px;height:12px;margin-left:2px}
  .rheart svg{width:16px;height:16px;margin:0}
  .rheart.on{color:var(--pink)}
  .rheart.on svg{fill:currentColor}
  .empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}

  /* ---------- layar mood ---------- */
  body.intro .nav,body.intro .dock{display:none}
  #scAuth .full{position:relative}
  .authbg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:.34}
  .authbg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(21,14,38,.5),rgba(21,14,38,.95))}
  .full{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
    padding:calc(var(--safe-t) + 40px) 0 40px;max-width:400px;margin:0 auto}
  .kick{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:var(--amber);margin:0;overflow-wrap:anywhere}
  .big{font-size:clamp(28px,8vw,38px);font-weight:600;line-height:1.1;letter-spacing:-.03em;margin:12px 0 0}
  .big b{font-weight:600;background:linear-gradient(96deg,var(--peach),var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{color:var(--muted);font-size:14.5px;margin:12px 0 0}
  .moodgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0 0}
  .moodcard{
    position:relative;overflow:hidden;cursor:pointer;text-align:left;
    aspect-ratio:1.15;border-radius:20px;padding:15px;
    border:1px solid var(--line);background:var(--surface);
    display:flex;flex-direction:column;justify-content:flex-end;
  }
  .moodcard:active{transform:scale(.97)}
  .moodcard .g{position:absolute;width:135%;height:135%;left:-18%;top:-46%;border-radius:50%;filter:blur(24px);opacity:.6}
  .moodcard b{position:relative;font-size:17px;font-weight:600;letter-spacing:-.01em}
  .moodcard span{position:relative;font-size:12.5px;color:var(--muted)}
  .skip{margin:22px auto 0;background:none;border:0;cursor:pointer;
    font-size:14px;font-weight:500;color:var(--muted);padding:12px;text-decoration:underline}

  /* ---------- form & panel ---------- */
  .field{display:block;margin-bottom:12px}
  .field span{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:500}
  .field input,.field textarea{
    width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:13px 15px;font-size:15px;color:var(--text)}
  .field textarea{min-height:74px;resize:vertical}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
  .btn{font-size:14.5px;font-weight:600;cursor:pointer;border-radius:14px;padding:13px 18px;
    border:1px solid transparent;background:var(--amber);color:#1A1220;flex:1 1 auto}
  .btn.ghost{background:none;border-color:var(--line);color:var(--text)}
  .btn.danger{background:none;border-color:rgba(232,106,154,.45);color:var(--pink)}
  .btn:active{transform:scale(.98)}
  .switch{display:block;margin:16px auto 0;background:none;border:0;cursor:pointer;
    font-size:13.5px;color:var(--muted);text-decoration:underline}
  .sect{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:16px}
  .sect h2{font-size:17px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .hint{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.5}
  .flash{background:rgba(245,169,60,.1);border:1px solid rgba(245,169,60,.3);border-radius:14px;
    padding:13px 15px;margin-top:14px;font-size:12.5px;color:#FFD9A6;line-height:1.5}
  .mini{font-size:12px;font-weight:500;cursor:pointer;background:var(--surface-2);
    border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--muted)}
  .mini.on{color:var(--pink);border-color:rgba(232,106,154,.45)}
  .mrow{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .mact{display:flex;gap:5px;flex:none}
  .box{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
    padding:13px;color:var(--muted);font:400 12px ui-monospace,monospace;min-height:92px;resize:vertical}
  .acct{display:flex;align-items:center;gap:12px;background:var(--surface);
    border:1px solid var(--line);border-radius:20px;padding:14px 16px}
  .acct .who{flex:1;min-width:0}
  .acct .who b{display:block;font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acct .who span{display:block;color:var(--muted);font-size:12.5px}
  .err{color:var(--pink);font-size:13px;min-height:18px;margin:8px 0 0}
  .lock{text-align:center;padding:60px 0;color:var(--muted);font-size:14px}
  .booting{text-align:center;color:var(--muted);font-size:14px;padding:40px 0}
  .search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:14px 17px;font-size:15px;color:var(--text);margin-top:10px}
  .search::placeholder{color:var(--muted)}

  /* ---------- pemutar melayang ---------- */
  .dock{
    position:fixed;left:16px;right:16px;z-index:14;
    bottom:calc(var(--nav-h) + var(--safe-b) + 22px);
    background:rgba(31,27,40,.94);backdrop-filter:blur(20px);
    border:1px solid var(--line);border-radius:22px;padding:10px;
    display:none;box-shadow:0 16px 40px rgba(0,0,0,.55);
  }
  .dock.on{display:block}
  .dockhead{display:flex;align-items:center;gap:8px;padding:0 4px 8px}
  .dockhead b{flex:1;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dockhead button{background:none;border:0;color:var(--muted);font-size:21px;line-height:1;cursor:pointer;padding:0 4px}
  .dock iframe{width:100%;height:80px;border:0;border-radius:14px;display:block}

  /* ---------- nav melayang ---------- */
  .nav{
    position:fixed;left:20px;right:20px;z-index:15;
    bottom:calc(var(--safe-b) + 14px);
    height:var(--nav-h);border-radius:999px;
    background:rgba(31,27,40,.86);backdrop-filter:blur(22px);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-around;padding:0 8px;
    box-shadow:0 14px 40px rgba(0,0,0,.5);
  }
  .nav button{
    width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;
    background:none;color:var(--muted);display:grid;place-items:center;
  }
  .nav svg{width:22px;height:22px}
  .nav button[aria-selected="true"]{background:var(--amber);color:#1A1220}
  .nav button:active{opacity:.7}

  .toast{position:fixed;left:50%;transform:translateX(-50%);z-index:30;
    bottom:calc(var(--nav-h) + var(--safe-b) + 34px);
    background:#FFF;color:#160F1C;border-radius:999px;padding:11px 20px;
    font-size:13px;font-weight:600;box-shadow:0 14px 34px rgba(0,0,0,.5);max-width:86vw;text-align:center}

  :focus-visible{outline:2px solid var(--amber);outline-offset:3px}
  @media (min-width:720px){
    main{max-width:900px;margin:0 auto}
    .nav{max-width:420px;margin:0 auto}
    .dock{max-width:520px;margin:0 auto}
  }
</style>
</head>
<body>

<div class="bloom"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<main>
  <!-- ===== MASUK ===== -->
  <section class="screen" id="scAuth"></section>

  <!-- ===== MOOD ===== -->
  <section class="screen on" id="scMood">
    <div class="full">
      <p class="kick" id="moodKicker">Selamat datang</p>
      <h1 class="big">Lagi ingin dengar <b>yang seperti apa?</b></h1>
      <div class="moodgrid" id="moodGrid"></div>
      <button class="skip" id="btnSkip">Lewati, tampilkan semua lagu</button>
    </div>
  </section>

  <!-- ===== BERANDA ===== -->
  <section class="screen" id="scHome">
    <div class="head">
      <button class="avatar" id="avatar">?</button>
      <span class="sp"></span>
      <button class="hbtn" id="hSearch" aria-label="Cari">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button class="hbtn" id="hFav" aria-label="Favorit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 22l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      </button>
    </div>

    <h1 class="greet">Hey, <b id="greetName">kamu</b></h1>
    <p class="sub" id="greetSub"></p>

    <div class="banner">
      <img src="banner.jpg" alt="" onerror="this.remove()">
      <div class="shade"></div>
      <div class="btext">
        <p class="kick">Good music, brighter days</p>
        <h2>Same songs,<br>brighter you</h2>
      </div>
    </div>

    <div class="chiprow" id="chips"></div>

    <div class="sechead"><h2>Pilihan untukmu</h2></div>
    <div id="featSlot"></div>

    <div class="sechead"><h2>Playlist hari ini</h2><button id="seeAll">Lihat semua</button></div>
    <ul class="rows" id="homeRows"></ul>
    <p class="empty" id="emptyHome" hidden>Belum ada lagu untuk mood ini.</p>
    <div class="pad"></div>
  </section>

  <!-- ===== CARI ===== -->
  <section class="screen" id="scSearch">
    <div class="head"><h1 class="greet" style="margin:0">Cari</h1></div>
    <input class="search" id="q" type="search" placeholder="Judul atau penyanyi" aria-label="Cari lagu">
    <div class="chiprow" id="chips2"></div>
    <ul class="rows" id="searchRows" style="margin-top:18px"></ul>
    <p class="empty" id="emptySearch" hidden>Tidak ada lagu yang cocok.</p>
    <div class="pad"></div>
  </section>

  <!-- ===== FAVORIT ===== -->
  <section class="screen" id="scFav"></section>

  <!-- ===== KELOLA ===== -->
  <section class="screen" id="scManage"></section>
</main>

<div class="dock" id="dock">
  <div class="dockhead"><b id="dockTitle"></b><button id="dockClose" aria-label="Tutup">&times;</button></div>
  <div id="dockBody"></div>
</div>

<nav class="nav" role="tablist">
  <button data-tab="home" aria-selected="true" role="tab" aria-label="Playlist">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
  </button>
  <button data-tab="search" aria-selected="false" role="tab" aria-label="Cari">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  </button>
  <button data-tab="fav" aria-selected="false" role="tab" aria-label="Favorit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 22l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
  </button>
  <button data-tab="manage" aria-selected="false" role="tab" aria-label="Kelola" id="navManage" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</nav>

<script src="konfigurasi.js"></script>
<script>
const ADMIN_KEY = window.ADMIN_KEY || "gantikatasandiini";
const SB_URL = window.SUPABASE_URL || "";
const SB_KEY = window.SUPABASE_ANON_KEY || "";
const DATA_FILE = "lagu.json";

const SEED = {
  title: "Good Vibes Playlist",
  note: "Kumpulan lagu yang bikin hari terasa lebih ringan.",
  moods: ["Ceria","Santai","Fokus","Sore"],
  songs: [
    {title:"Sunday Best", artist:"Surfaces", url:"", img:"", tags:["Ceria","Internasional"], note:"Pembuka pagi yang susah dibenci."},

const LS_KEY="goodvibes-draft", FAV_KEY="goodvibes-favs";
let data=null, published=null, admin=false, tab="mood";
let filterTag=null, query="", editingIndex=null, confirmDelete=null, storageOK=true;
let sb=null, user=null, favs=new Set(), authMode="login";
let booted=false, authError=false, isAdmin=false;

const GATE_ON = !!(SB_URL && SB_KEY);
const secretUnlock = location.hash==="#kelola";
const canEdit = () => GATE_ON ? isAdmin : admin;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){storageOK=false;return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){storageOK=false}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){storageOK=false}};

const link = s => (s.url&&s.url.trim()) ? s.url.trim()
  : "https://open.spotify.com/search/"+encodeURIComponent(s.artist+" "+s.title);
const tid = s => { const m=/(?:track\/|track:)([A-Za-z0-9]{22})/.exec(s.url||""); return m?m[1]:null; };
function hue(str){let h=0;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))%360;return h}
const grad = s => { const h=hue(s.title+s.artist);
  return "linear-gradient(140deg,hsl("+h+",76%,62%),hsl("+((h+52)%360)+",70%,44%))"; };
const initial = s => esc(((s.artist||s.title||"?").trim().charAt(0)||"?").toUpperCase());
const hasDraft = () => published && JSON.stringify(published)!==JSON.stringify(data);

const favKey = s => tid(s) || (s.title+"-"+s.artist).toLowerCase().replace(/[^a-z0-9]+/g,"-");
const isFav = s => favs.has(favKey(s));

const PLAY='<svg viewBox="0 0 12 14" fill="currentColor"><path d="M0 0l12 7-12 7z"/></svg>';
const HEART='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 22l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>';
const LINKICO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';

function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function openSpotify(s){ window.open(link(s),"_blank","noopener"); }

/* ---------- pemutar ---------- */
let dockId=null;
function playTrack(s){
  const id=tid(s);
  if(!id){ toast("Lagu ini belum punya tautan langsung"); return; }
  if(dockId===id){ closeDock(); return; }
  dockId=id;
  $("dockTitle").textContent=s.title+(s.artist?" · "+s.artist:"");
  $("dockBody").innerHTML='<iframe loading="lazy" allow="encrypted-media" src="https://open.spotify.com/embed/track/'+id+'"></iframe>';
  $("dock").classList.add("on");
}
function closeDock(){ dockId=null; $("dockBody").innerHTML=""; $("dock").classList.remove("on"); }
$("dockClose").onclick=closeDock;

/* ---------- favorit ---------- */
async function loadFavs(){
  if(sb&&user){
    try{
      const {data:rows,error}=await sb.from("favorites").select("song_key").eq("user_id",user.id);
      if(!error){ favs=new Set((rows||[]).map(r=>r.song_key)); return; }
    }catch(e){}
  }
  try{ favs=new Set(JSON.parse(lsGet(FAV_KEY)||"[]")); }catch(e){ favs=new Set(); }
}
async function toggleFav(s){
  const k=favKey(s), was=favs.has(k);
  was?favs.delete(k):favs.add(k);
  render();
  if(sb&&user){
    try{
      if(was) await sb.from("favorites").delete().eq("user_id",user.id).eq("song_key",k);
      else await sb.from("favorites").insert({user_id:user.id,song_key:k});
    }catch(e){ toast("Gagal menyimpan ke akun"); }
  } else lsSet(FAV_KEY,JSON.stringify([...favs]));
}

/* ---------- akun ---------- */
async function checkAdmin(){
  isAdmin=false;
  if(sb&&user){
    try{
      const {data:rows,error}=await sb.from("admins").select("user_id").eq("user_id",user.id).limit(1);
      if(!error) isAdmin=!!(rows&&rows.length);
    }catch(e){}
  }
}
async function initAuth(){
  if(!GATE_ON){ booted=true; return; }
  try{
    const {createClient}=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    sb=createClient(SB_URL,SB_KEY);
    const {data:sess}=await sb.auth.getSession();
    user=sess.session?sess.session.user:null;
    sb.auth.onAuthStateChange(async(_e,s)=>{
      const before=!!user;
      user=s?s.user:null;
      await checkAdmin(); await loadFavs(); render();
      if(user&&!before) afterLogin();
      if(!user) go("auth");
    });
    await checkAdmin(); await loadFavs();
    booted=true; render();
    if(user) afterLogin(); else go("auth");
  }catch(e){ sb=null; authError=true; booted=true; render(); }
}
function afterLogin(){ go(moodList().length?"mood":"home"); }
async function doAuth(){
  const email=$("aEmail").value.trim(), pass=$("aPass").value;
  if(!email||!pass){ toast("Email dan kata sandi wajib diisi"); return; }
  const btn=$("aGo"); btn.disabled=true; btn.textContent="Memproses...";
  try{
    if(authMode==="signup"){
      const {error}=await sb.auth.signUp({email,password:pass});
      if(error) throw error;
      toast("Akun dibuat. Cek email bila diminta verifikasi.");
    } else {
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error) throw error;
      toast("Berhasil masuk");
    }
  }catch(e){ toast(e.message||"Gagal, coba lagi"); }
  btn.disabled=false; render();
}
async function signOut(){
  if(!sb) return;
  await sb.auth.signOut();
  user=null; isAdmin=false;
  await loadFavs(); render(); go("auth");
  toast("Kamu sudah keluar");
}

/* ---------- data ---------- */
async function load(){
  let base=SEED;
  try{
    const r=await fetch(DATA_FILE,{cache:"no-store"});
    if(r.ok){ const j=await r.json(); if(j&&Array.isArray(j.songs)) base=j; }
  }catch(e){}
  published=JSON.parse(JSON.stringify(base));
  const d=lsGet(LS_KEY);
  try{ data=d?JSON.parse(d):JSON.parse(JSON.stringify(base)); }
  catch(e){ data=JSON.parse(JSON.stringify(base)); }
  await loadFavs();
  render();
  if(GATE_ON){ go("auth"); initAuth(); }
  else { booted=true; go(moodList().length?"mood":"home"); }
}
function save(){ lsSet(LS_KEY,JSON.stringify(data)); render(); }

async function fetchCover(s,el){
  try{
    const r=await fetch("https://open.spotify.com/oembed?url="+encodeURIComponent(s.url));
    if(!r.ok) return;
    const j=await r.json();
    if(j&&j.thumbnail_url&&el){
      const img=new Image(); img.alt=""; img.src=j.thumbnail_url;
      img.onload=()=>{ const i=el.querySelector(".ini"); if(i)i.remove(); el.prepend(img); };
    }
  }catch(e){}
}

function filtered(useQuery){
  const q=useQuery?query.toLowerCase():"";
  return data.songs.filter(s=>{
    const okT=!filterTag||(s.tags||[]).includes(filterTag);
    const okQ=!q||(s.title+" "+s.artist+" "+(s.note||"")).toLowerCase().includes(q);
    return okT&&okQ;
  });
}
function moodList(){
  const all=[...new Set(data.songs.flatMap(s=>s.tags||[]))];
  const picked=(data.moods&&data.moods.length)?data.moods:all;
  return picked.filter(m=>data.songs.some(s=>(s.tags||[]).includes(m)));
}
function pickMood(m){ filterTag=m; render(); go("home"); }

/* ---------- komponen ---------- */
function mkChip(label,val,box){
  const b=document.createElement("button");
  b.className="chip"; b.textContent=label;
  b.setAttribute("aria-pressed", filterTag===val?"true":"false");
  b.onclick=()=>{ filterTag=val; render(); };
  box.appendChild(b);
}

function mkRow(s){
  const li=document.createElement("li");
  li.className="row";
  const id=tid(s);
  li.innerHTML=
    '<div class="thumb" style="background:'+grad(s)+'">'+
      (s.img?'<img alt="" src="'+esc(s.img)+'">':'<span class="ini">'+initial(s)+'</span>')+
    '</div>'+
    '<div class="rtx"><b>'+esc(s.title)+'</b><span>'+esc(s.artist||"Penyanyi belum diisi")+'</span></div>'+
    '<button class="rbtn rheart'+(isFav(s)?" on":"")+'" aria-label="Favorit">'+HEART+'</button>'+
    (id?'<button class="rbtn rplay" aria-label="Putar">'+PLAY+'</button>':'');
  if(!s.img&&id) fetchCover(s,li.querySelector(".thumb"));
  li.querySelector(".rheart").onclick=e=>{e.stopPropagation();toggleFav(s)};
  const p=li.querySelector(".rplay");
  if(p) p.onclick=e=>{e.stopPropagation();playTrack(s)};
  li.onclick=()=>openSpotify(s);
  return li;
}

function mkFeatured(s){
  const d=document.createElement("div");
  d.className="feat";
  const id=tid(s);
  d.innerHTML=
    '<div class="art" style="background:'+grad(s)+'"></div>'+
    '<div class="fx"><h3>'+esc(s.title)+'</h3>'+
      '<p>'+esc(s.note||s.artist)+'</p></div>'+
    '<div class="acts">'+
      '<button class="fbtn" aria-label="Putar">'+PLAY+'</button>'+
      '<button class="fico'+(isFav(s)?" on":"")+'" aria-label="Favorit">'+HEART+'</button>'+
      '<button class="fico" aria-label="Buka di Spotify">'+LINKICO+'</button>'+
    '</div>';
  if(s.img) d.querySelector(".art").style.backgroundImage="url('"+esc(s.img)+"')";
  else if(id) fetchFeatCover(s,d.querySelector(".art"));
  const btns=d.querySelectorAll(".acts button");
  btns[0].onclick=()=>playTrack(s);
  btns[1].onclick=()=>toggleFav(s);
  btns[2].onclick=()=>openSpotify(s);
  return d;
}
async function fetchFeatCover(s,el){
  try{
    const r=await fetch("https://open.spotify.com/oembed?url="+encodeURIComponent(s.url));
    if(!r.ok) return;
    const j=await r.json();
    if(j&&j.thumbnail_url&&el) el.style.backgroundImage="url('"+j.thumbnail_url+"')";
  }catch(e){}
}

/* ---------- render ---------- */
function render(){
  const name = user ? (user.email.split("@")[0]) : "kamu";
  $("greetName").textContent = name;
  $("avatar").textContent = name.charAt(0).toUpperCase();
  $("greetSub").textContent = user ? user.email : (data.note||"");
  $("moodKicker").textContent = user ? "Masuk sebagai "+user.email : "Selamat datang";
  $("navManage").hidden = !(GATE_ON ? isAdmin : secretUnlock);

  // chip mood
  const moods=moodList();
  const c1=$("chips"); c1.innerHTML="";
  mkChip("Semua",null,c1); moods.forEach(m=>mkChip(m,m,c1));
  const c2=$("chips2"); c2.innerHTML="";
  const all=[...new Set(data.songs.flatMap(s=>s.tags||[]))];
  mkChip("Semua",null,c2); all.forEach(m=>mkChip(m,m,c2));

  // kartu mood
  const mg=$("moodGrid"); mg.innerHTML="";
  moods.forEach(m=>{
    const n=data.songs.filter(s=>(s.tags||[]).includes(m)).length;
    const h=hue(m);
    const b=document.createElement("button");
    b.className="moodcard";
    b.innerHTML='<span class="g" style="background:radial-gradient(circle,hsl('+h+',82%,62%),transparent 66%)"></span>'+
      '<b>'+esc(m)+'</b><span>'+n+' lagu</span>';
    b.onclick=()=>pickMood(m);
    mg.appendChild(b);
  });

  // beranda
  const home=filtered(false);
  const fs=$("featSlot"); fs.innerHTML="";
  if(home.length) fs.appendChild(mkFeatured(home[0]));
  const hr=$("homeRows"); hr.innerHTML="";
  home.slice(1).forEach(s=>hr.appendChild(mkRow(s)));
  $("emptyHome").hidden=home.length>0;

  // cari
  const list=filtered(true);
  const sr=$("searchRows"); sr.innerHTML="";
  list.forEach(s=>sr.appendChild(mkRow(s)));
  $("emptySearch").hidden=list.length>0;

  renderAuth(); renderFav(); renderManage();
}

      if(a==="del"){
        if(confirmDelete===i){data.songs.splice(i,1);confirmDelete=null;toast("Lagu dihapus")}
        else{confirmDelete=i;render();return}
      }
      confirmDelete=null; save();
    };
    ml.appendChild(d);
  });

  $("bSave").onclick=submitForm;
  $("bBulk").onclick=bulkAdd;
  $("bFind").onclick=()=>{
    const t=$("fTitle").value.trim(), a=$("fArtist").value.trim();
    if(!t&&!a){toast("Isi judul atau penyanyinya dulu");return}
    window.open("https://open.spotify.com/search/"+encodeURIComponent(a+" "+t),"_blank","noopener");
  };
  if($("bCancel")) $("bCancel").onclick=()=>{editingIndex=null;render()};
  $("bHead").onclick=()=>{
    data.title=$("hTitle").value.trim()||data.title;
    data.note=$("hNote").value.trim();
    data.moods=$("hMoods").value.split(",").map(t=>t.trim()).filter(Boolean);
    save(); toast("Tersimpan");
  };
  $("bExport").onclick=exportJson;
  $("bImport").onclick=importJson;
  $("bShow").onclick=showJson;
  $("bExit").onclick=()=>{ editingIndex=null;confirmDelete=null; if(!GATE_ON) admin=false; render(); go("home"); };
  if($("bReset")) $("bReset").onclick=()=>{
    lsDel(LS_KEY); data=JSON.parse(JSON.stringify(published)); editingIndex=null; render(); toast("Perubahan dibuang");
  };

  if(editingIndex!==null){
    const s=data.songs[editingIndex];
    $("fTitle").value=s.title||""; $("fArtist").value=s.artist||"";
    $("fUrl").value=s.url||""; $("fTags").value=(s.tags||[]).join(", ");
    $("fNote").value=s.note||"";
  }
}

function submitForm(){
  const title=$("fTitle").value.trim(), artist=$("fArtist").value.trim();
  if(!title||!artist){toast("Judul dan penyanyi wajib diisi");return}
  const song={title,artist,url:$("fUrl").value.trim(),img:"",
    tags:$("fTags").value.split(",").map(t=>t.trim()).filter(Boolean),
    note:$("fNote").value.trim()};
  if(editingIndex===null){data.songs.push(song);toast("Lagu ditambahkan")}
  else{song.img=data.songs[editingIndex].img||"";data.songs[editingIndex]=song;toast("Perubahan disimpan")}
  editingIndex=null; save();
}

async function bulkAdd(){
  const raw=$("fBulk").value.trim();
  if(!raw){toast("Tempel dulu tautannya");return}
  const btn=$("bBulk"); btn.textContent="Mengambil data..."; btn.disabled=true;
  let added=0,skipped=0;
  for(const line of raw.split(/\n+/)){
    const text=line.trim(); if(!text) continue;
    const m=/(https?:\/\/open\.spotify\.com\/(?:intl-[a-z]+\/)?track\/[A-Za-z0-9]{22})/.exec(text);
    if(!m){skipped++;continue}
    const url=m[1], code=url.split("/track/")[1].slice(0,22);
    if(data.songs.some(s=>(s.url||"").includes(code))){skipped++;continue}
    const before=text.slice(0,m.index).replace(/[-–—|]\s*$/,"").trim();
    let title="",artist="",img="";
    if(before){ const p=before.split(/\s+[-–—]\s+/); title=(p[0]||"").trim(); artist=(p[1]||"").trim(); }
    if(!title){
      try{
        const r=await fetch("https://open.spotify.com/oembed?url="+encodeURIComponent(url));
        if(r.ok){const j=await r.json(); title=(j.title||"").trim(); img=j.thumbnail_url||"";}
      }catch(e){}
    }
    data.songs.push({title:title||"Lagu baru, isi judulnya",artist,url,img,tags:[],note:""});
    added++;
  }
  btn.disabled=false; save();
  toast(added+" lagu ditambahkan"+(skipped?", "+skipped+" dilewati":""));
}

function exportJson(){
  try{
    const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download=DATA_FILE;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
    toast("lagu.json diunduh");
  }catch(e){ showJson(); toast("Unduhan diblokir, salin manual"); }
}
function showJson(){
  let ta=$("jsonOut");
  if(ta){ta.remove();return}
  ta=document.createElement("textarea");
  ta.id="jsonOut"; ta.className="box"; ta.readOnly=true;
  ta.style.marginTop="12px"; ta.style.minHeight="170px";
  ta.value=JSON.stringify(data,null,2);
  $("bShow").closest(".sect").appendChild(ta);
  ta.focus(); ta.select();
}
function importJson(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const j=JSON.parse(r.result);
        if(!j||!Array.isArray(j.songs)) throw new Error();
        data=j; save(); toast("Daftar diimpor");
      }catch(e){toast("File itu bukan lagu.json yang valid")}
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ---------- navigasi ---------- */
const SCREENS={auth:"scAuth",mood:"scMood",home:"scHome",search:"scSearch",fav:"scFav",manage:"scManage"};
function go(name){
  if(name==="manage" && !canEdit() && !(!GATE_ON&&secretUnlock)) name="home";
  tab=name;
  document.body.classList.toggle("intro", name==="mood"||name==="auth");
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  if(SCREENS[name]) $(SCREENS[name]).classList.add("on");
  document.querySelectorAll(".nav button").forEach(b=>
    b.setAttribute("aria-selected", b.dataset.tab===name?"true":"false"));
  window.scrollTo({top:0});
  if(name==="search") setTimeout(()=>$("q").focus(),120);
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
$("hSearch").onclick=()=>go("search");
$("hFav").onclick=()=>go("fav");
$("avatar").onclick=()=>go("fav");
$("seeAll").onclick=()=>go("search");
$("btnSkip").onclick=()=>{ filterTag=null; render(); go("home"); };
$("q").oninput=e=>{ query=e.target.value; render(); };

if("serviceWorker" in navigator){
  addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
load();
</script>
